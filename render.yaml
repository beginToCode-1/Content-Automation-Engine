services:
  - type: web
    name: content-automation-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: YOUTUBE_API_KEY
        sync: false
      - key: UPLOAD_PRIVACY_STATUS
        value: private
      # No persistent disk on the free plan: this is a relative path inside
      # the container's own ephemeral filesystem, wiped on every restart/
      # redeploy. Downloaded videos and rendered clips are lost when that
      # happens - switch to /data/work (and add a Render Disk) once you
      # upgrade if you need those to survive. User accounts and run history
      # no longer live here at all - they're in Postgres (DATABASE_URL
      # below), which persists independently of this container.
      - key: WORK_DIR
        value: work
      # Postgres connection string - Supabase's Session pooler URI (not
      # Transaction pooler: this app holds its own persistent connection
      # pool, and Transaction-mode pooling disables prepared statements).
      # Fill in via Render's dashboard, not committed here.
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_MAX_WORKERS
        value: "2"
      - key: SCHEDULER_POLL_INTERVAL_S
        value: "30"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: NOTIFY_DESKTOP_ENABLED
        value: "false"
