services:
  - type: web
    name: content-automation-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: YOUTUBE_API_KEY
        sync: false
      - key: UPLOAD_PRIVACY_STATUS
        value: private
      # No persistent disk on the free plan: these are relative paths inside
      # the container's own ephemeral filesystem, wiped on every restart/
      # redeploy. Switch to /data/... (and add a disk) once you upgrade.
      - key: WORK_DIR
        value: work
      - key: DB_PATH
        value: content_engine.db
      - key: DASHBOARD_MAX_WORKERS
        value: "2"
      - key: SCHEDULER_POLL_INTERVAL_S
        value: "30"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: NOTIFY_DESKTOP_ENABLED
        value: "false"
